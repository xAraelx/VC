__include__:
- ../../RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/rtdetrv2_r50vd_6x_coco.yml
output_dir: runs/rtdetr_nativo
num_classes: 1
remap_mscoco_category: false
epoches: 100
checkpoint_freq: 1000000
print_freq: 5
use_amp: true
use_ema: true
sync_bn: false
PResNet:
  pretrained: false
lr_warmup_scheduler:
  warmup_duration: 1185
train_dataloader:
  dataset:
    type: CocoDetectionExif
    img_folder: C:/Users/Usuario/Downloads/VC/Prac1/P4/datos/images_1280
    ann_file: C:/Users/Usuario/Downloads/VC/Prac1/P4/datos/coco_train.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: ColorJitter
        brightness: 0.5
        saturation: 0.6
        hue: 0.015
      - type: RandomAffine
        degrees: 5.0
        translate:
        - 0.1
        - 0.1
        scale:
        - 0.5
        - 1.5
        shear:
        - -2.0
        - 2.0
        - -2.0
        - 2.0
        fill: 114
      - type: RandomPerspective
        distortion_scale: 0.15
        p: 1.0
        fill: 114
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: Resize
        size:
        - 640
        - 640
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: default
  collate_fn:
    type: BatchImageCollateFunction
    scales: null
    stop_epoch: null
  total_batch_size: 4
  num_workers: 0
  shuffle: true
val_dataloader:
  dataset:
    type: CocoDetectionExif
    img_folder: C:/Users/Usuario/Downloads/VC/Prac1/P4/datos/images_1280
    ann_file: C:/Users/Usuario/Downloads/VC/Prac1/P4/datos/coco_val.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
      policy:
        name: default
  total_batch_size: 4
  num_workers: 0
  shuffle: false
