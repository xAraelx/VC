tracker_type: bytetrack
track_high_thresh: 0.3
track_low_thresh: 0.05    # aprovecha detecciones muy débiles para mantener el track
new_track_thresh: 0.6     # cuesta más crear IDs nuevos
track_buffer: 60          # aguanta ~2 s sin ver la matrícula
match_thresh: 0.95        # muy permisivo: cajas pequeñas apenas se solapan entre frames
fuse_score: True